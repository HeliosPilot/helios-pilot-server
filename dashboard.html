<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeliosPilot Dashboard</title>
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--panel:#0a0a0a;--text:#fff;--muted:#a1a1aa;--border:rgba(255,255,255,.12);--accent:#22c55e;--font-sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;--font-mono:"Cascadia Code","Fira Code",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:radial-gradient(circle at top,rgba(255,255,255,.06),transparent 35%),var(--bg);color:var(--text);min-height:100vh}
.container{width:min(1180px,92%);margin:0 auto;padding:32px 0}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--border)}
.brand{font-weight:900;letter-spacing:.02em}
.hero{padding:34px 0 18px}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.03em;margin:0 0 8px}
.hero p{color:var(--muted);max-width:760px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
.card{background:linear-gradient(180deg,rgba(15,15,15,.96),rgba(5,5,5,.9));border:1px solid var(--border);border-radius:22px;padding:24px;transition:.25s transform,.25s border-color,.25s box-shadow}
.card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.24);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.label{color:var(--muted);font-size:.88rem;margin-bottom:10px}
.value{font-size:1.5rem;font-weight:900}
.terminal{background:#050505;border:1px solid var(--border);border-radius:18px;padding:18px;font-family:var(--font-mono);font-size:.9rem;color:#e5e5e5;min-height:120px;white-space:pre-wrap;word-break:break-word;margin-top:24px}
.section{margin-top:34px}
.section h2{font-size:1.35rem;margin-bottom:12px}
.command-wrap{display:flex;gap:10px;margin-top:12px}
.command-input{flex:1;background:#0a0a0a;border:1px solid var(--border);border-radius:12px;padding:12px;color:#fff;font-family:var(--font-mono)}
.command-btn{padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:#fff;color:#000;font-weight:800;cursor:pointer}
.chart{display:grid;gap:10px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#fff,#71717a);border-radius:999px}
.export-btn{margin-top:14px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:transparent;color:#fff;cursor:pointer}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<nav>
  <div class="brand">HeliosPilot Dashboard</div>
  <a href="/" style="color:var(--muted)">Home</a>
</nav>
<section class="hero">
  <h1>Bot Usage Dashboard</h1>
  <p>المشروع: HELIOS-NET | Uptime (session): <strong id="uptime">0s</strong></p>
</section>
<div class="grid">
  <div class="card"><div class="label">Telegram</div><div class="value" id="telegram">--</div></div>
  <div class="card"><div class="label">GitHub</div><div class="value" id="github">--</div></div>
  <div class="card"><div class="label">AI</div><div class="value" id="ai">--</div></div>
  <div class="card"><div class="label">Sentry</div><div class="value" id="sentry">--</div></div>
  <div class="card"><div class="label">KV</div><div class="value" id="kv">--</div></div>
  <div class="card"><div class="label">Last Check</div><div class="value" id="last">--</div></div>
  <div class="card"><div class="label">Bot Test</div><div class="value" id="botTest">--</div></div>
  <div class="card"><div class="label">Telegram Test</div><div class="value" id="telegramTest">--</div></div>
  <div class="card"><div class="label">API Latency</div><div class="value" id="latency">--</div></div>
  <div class="card"><div class="label">API Response</div><div class="value" id="apiRaw" style="font-size:.85rem;word-break:break-word">--</div></div>
</div>

<section class="section">
  <h2>Command Runner</h2>
  <div class="command-wrap">
    <input id="dashCommand" class="command-input" type="text" placeholder="/status" />
    <button id="runCommand" class="command-btn">Run</button>
  </div>
  <div class="terminal" id="dashTerminal">Ready.</div>
</section>

<section class="section">
  <h2>Charts</h2>
  <div class="chart">
    <div class="bar-row"><span>Uptime</span><div class="bar"><span id="barUptime" style="width:0%"></span></div><span id="uptimeValue">0s</span></div>
    <div class="bar-row"><span>Latency</span><div class="bar"><span id="barLatency" style="width:0%"></span></div><span id="latencyValue">0ms</span></div>
    <div class="bar-row"><span>Errors</span><div class="bar"><span id="barErrors" style="width:0%"></span></div><span id="errorsValue">0</span></div>
  </div>
  <button id="exportLogs" class="export-btn">Export Logs (JSON)</button>
</section>
</div>

<script>
const start = Date.now();
const logs = [];
let errorCount = 0;
setInterval(() => {
  const s = Math.floor((Date.now() - start) / 1000);
  document.getElementById('uptime').textContent = s + 's';
  document.getElementById('uptimeValue').textContent = s + 's';
  const uptimePercent = Math.min(100, Math.round((s / 3600) * 100));
  document.getElementById('barUptime').style.width = uptimePercent + '%';
}, 1000);

async function load() {
  try {
    const r = await fetch('/api?health=true');
    const d = await r.json();
    const s = d.services || {};
    const set = (id, ok) => {
      const el = document.getElementById(id);
      el.textContent = ok ? 'Online' : 'Offline';
      el.style.color = ok ? '#22c55e' : '#ef4444';
    };
    set('telegram', s.telegram);
    set('github', s.github);
    set('ai', s.ai);
    set('sentry', s.sentry);
    set('kv', s.kv);
    document.getElementById('last').textContent = new Date().toLocaleTimeString();

    const t0 = performance.now();
    const tr = await fetch('/api?test=true');
    const td = await tr.json();
    const ms = Math.round(performance.now() - t0);
    document.getElementById('latency').textContent = ms + ' ms';
    document.getElementById('latencyValue').textContent = ms + ' ms';
    document.getElementById('barLatency').style.width = Math.min(100, Math.round(ms / 10)) + '%';
    document.getElementById('botTest').textContent = td.success ? 'OK' : 'Error';
    document.getElementById('botTest').style.color = td.success ? '#22c55e' : '#ef4444';
    document.getElementById('telegramTest').textContent = td.telegram ? 'OK' : 'Error';
    document.getElementById('telegramTest').style.color = td.telegram ? '#22c55e' : '#ef4444';
    document.getElementById('apiRaw').textContent = JSON.stringify(td);
    document.getElementById('terminalOutput')?.replaceChildren?.();
    document.getElementById('dashTerminal').textContent = 'Health: ' + JSON.stringify(d.services) + '\\nBot: ' + JSON.stringify(td);
    logs.push({ time: new Date().toISOString(), health: d.services, bot: td, latency: ms });
    if (!td.success) errorCount += 1;
    document.getElementById('errorsValue').textContent = errorCount;
    document.getElementById('barErrors').style.width = Math.min(100, errorCount * 10) + '%';
  } catch (e) {
    document.getElementById('last').textContent = 'Error';
    document.getElementById('botTest').textContent = 'Error';
    document.getElementById('telegramTest').textContent = 'Error';
    document.getElementById('apiRaw').textContent = e.message;
    document.getElementById('dashTerminal').textContent = 'Error: ' + e.message;
    errorCount += 1;
    document.getElementById('errorsValue').textContent = errorCount;
    document.getElementById('barErrors').style.width = Math.min(100, errorCount * 10) + '%';
  }
}
load();
setInterval(load, 30000);

const dashHistory = [];
let dashHistoryIndex = -1;
const dashCommands = ['/start','/status','/clear','/metrics','/review','/autofix','/createwiki','/analyze-perf','repos'];
document.getElementById('dashCommand').addEventListener('keydown', (event) => {
  if (event.key === 'ArrowUp') {
    event.preventDefault();
    if (dashHistory.length && dashHistoryIndex < dashHistory.length - 1) {
      dashHistoryIndex += 1;
      document.getElementById('dashCommand').value = dashHistory[dashHistoryIndex];
    }
  } else if (event.key === 'ArrowDown') {
    event.preventDefault();
    if (dashHistoryIndex > 0) {
      dashHistoryIndex -= 1;
      document.getElementById('dashCommand').value = dashHistory[dashHistoryIndex];
    } else {
      dashHistoryIndex = -1;
      document.getElementById('dashCommand').value = '';
    }
  } else if (event.key === 'Tab') {
    event.preventDefault();
    const value = document.getElementById('dashCommand').value.trim();
    const match = dashCommands.find((command) => command.startsWith(value) && command !== value);
    if (match) document.getElementById('dashCommand').value = match;
  }
});
document.getElementById('runCommand').addEventListener('click', async () => {
  const cmd = document.getElementById('dashCommand').value.trim();
  if (!cmd) return;
  dashHistory.unshift(cmd);
  dashHistoryIndex = -1;
  const terminal = document.getElementById('dashTerminal');
  terminal.textContent += '
$ ' + cmd;
  document.getElementById('dashCommand').value = '';
  try {
    const r = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: { chat: { id: 12345 }, text: cmd, message_id: Date.now() } })
    });
    const d = await r.json();
    terminal.textContent += '
' + JSON.stringify(d);
  } catch (e) {
    terminal.textContent += '
Error: ' + e.message;
  }
  terminal.scrollTop = terminal.scrollHeight;
});

document.getElementById('exportLogs').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'heliospilot-logs.json';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
