<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeliosPilot Dashboard Access</title>
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:#000;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(460px,100%);background:#0a0a0a;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px}
h1{margin-bottom:10px}
p{color:#a1a1aa;margin-bottom:18px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#050505;color:#fff;margin-bottom:12px}
button{width:100%;padding:12px;border-radius:12px;border:none;background:#fff;color:#000;font-weight:900;cursor:pointer}
iframe{width:100%;height:85vh;border:0;border-radius:18px;margin-top:18px}
.error{color:#ef4444;margin-top:10px}
</style>
</head>
<body>
<div class="card" id="gate">
  <h1>Dashboard Access</h1>
  <p>أدخل رمز الوصول (DASHBOARD_TOKEN).</p>
  <input id="token" type="password" placeholder="Access token">
  <button id="open">Open Dashboard</button>
  <div class="error" id="error"></div>
</div>
<div id="frameWrap" style="display:none;width:min(1240px,100%)">
  <iframe id="dashboardFrame" title="HeliosPilot Dashboard"></iframe>
</div>
<script>
const gate = document.getElementById('gate');
const frameWrap = document.getElementById('frameWrap');
const frame = document.getElementById('dashboardFrame');
const tokenInput = document.getElementById('token');
const error = document.getElementById('error');
const saved = sessionStorage.getItem('dashboardToken');
if (saved) openDashboard(saved);
document.getElementById('open').addEventListener('click', () => openDashboard(tokenInput.value.trim()));
function openDashboard(token) {
  if (!token) { error.textContent = 'Token required'; return; }
  const url = '/api/dashboard?token=' + encodeURIComponent(token);
  fetch(url).then((res) => {
    if (!res.ok) throw new Error('Invalid token');
    sessionStorage.setItem('dashboardToken', token);
    gate.style.display = 'none';
    frameWrap.style.display = 'block';
    frame.src = url;
  }).catch((e) => {
    error.textContent = e.message;
  });
}
</script>
</body>
</html>
